<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Tangled input wires -->
  <g stroke="#9CA3AF" stroke-width="2" stroke-linecap="round">
    <!-- Top weave converging to center -->
    <path d="M 3 6 C 10 6, 8 16, 17 16" />
    <!-- Bottom weave converging to center -->
    <path d="M 3 26 C 10 26, 9 16, 17 16" />
    <!-- Center direct path -->
    <path d="M 3 16 H 17" opacity="0.6" />
  </g>

  <!-- Convergence Junction Node -->
  <circle cx="17" cy="16" r="2.5" fill="#EEF1F0" stroke="#9CA3AF" stroke-width="1.5" />

  <!-- Optimized Signal Blue Output Pipeline -->
  <line x1="17" y1="16" x2="27" y2="16" stroke="#2F6FED" stroke-width="3" stroke-linecap="round" />
  
  <!-- Terminal Node Pulse Ring -->
  <circle cx="27" cy="16" r="4" fill="none" stroke="#2F6FED" stroke-width="1" opacity="0.4" />
  
  <!-- Terminal Signal Node -->
  <circle cx="27" cy="16" r="2.5" fill="#2F6FED" />
</svg>
